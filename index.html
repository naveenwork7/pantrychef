<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6B47">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PantryChef – cook with what you have</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3EA; --paper:#fff; --ink:#12261B; --muted:#5B6F61; --line:#D3DECE;
  --leaf:#2E6B47; --lemon:#F5C83B; --radish:#D1435B; --mint:#DCEBD7;
  --shadow:0 8px 28px rgba(18,38,27,.10);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:70px}
body{margin:0;background:radial-gradient(1200px 400px at 50% -120px,#fff7d6 0,transparent 70%),var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 150px}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;margin:0 -16px;background:rgba(238,243,234,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.logo{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em;display:flex;gap:8px;align-items:center}
.logo span{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:var(--lemon);font-size:1.1rem;transform:rotate(-6deg)}
nav{display:flex;gap:2px;background:#fff;padding:3px;border-radius:999px;box-shadow:0 1px 0 var(--line)}
nav button{border:0;background:none;padding:8px 15px;border-radius:999px;font-weight:700;color:var(--muted);font-size:.95rem}
nav button[aria-pressed="true"]{background:var(--ink);color:#fff}

h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,8vw,3.1rem);line-height:1.02;letter-spacing:-.03em;margin:18px 0 8px}
.lead{color:var(--muted);font-size:1.05rem;margin:0 0 18px;max-width:44ch}
h2{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em;margin:28px 0 12px}

/* upload */
.drop{display:block;border:2px dashed var(--leaf);border-radius:26px;background:rgba(255,255,255,.75);padding:18px;text-align:center;transition:.15s}
.drop.over{background:var(--mint);border-style:solid}
.drop strong{font-family:var(--display);font-size:1.2rem;display:block}
.drop p{margin:2px 0 14px;color:var(--muted);font-size:.95rem}
@media (hover:none){.drop .desk{display:none}}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn.ghost{background:var(--mint);color:var(--ink)}
.btn.lemon{background:var(--lemon);color:var(--ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}
.thumbs{display:flex;gap:10px;overflow-x:auto;margin-top:14px;padding:4px 2px 8px;scroll-snap-type:x proximity}
.thumbs:empty{display:none}
.thumb{position:relative;flex:none;width:92px;height:92px;border-radius:16px;overflow:hidden;border:3px solid #fff;box-shadow:var(--shadow);scroll-snap-align:start}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(18,38,27,.85);color:#fff;font-size:15px;line-height:1}

.panel{background:var(--paper);border-radius:22px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}
label.field{display:block;font-weight:700;margin-bottom:6px;font-size:.95rem}
textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:#fbfdf9;resize:vertical;min-height:64px;font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.row .full{grid-column:1/-1}
select,.add-ing input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:#fbfdf9;font-size:16px;min-height:48px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fbfdf9;padding:9px 15px;border-radius:999px;font-weight:500;min-height:42px}
.chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:48px;height:48px;border-radius:14px;border:1.5px solid var(--line);background:#fbfdf9;font-size:1.3rem;font-weight:700}
.stepper output{min-width:38px;text-align:center;font-weight:700;font-size:1.2rem}

.cta{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:22px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 62%,rgba(238,243,234,0))}
.cta .btn{max-width:820px;margin:0 auto;display:flex;font-size:1.1rem;min-height:56px;border-radius:18px;box-shadow:0 8px 20px rgba(245,200,59,.45)}

/* found + dishes */
.found{display:flex;flex-wrap:wrap;gap:8px}
.ing{display:inline-flex;gap:6px;align-items:center;background:var(--mint);padding:6px 6px 6px 13px;border-radius:999px;font-weight:500}
.ing button{border:0;background:#fff;width:24px;height:24px;border-radius:50%;line-height:1;color:var(--muted)}
.add-ing{display:flex;gap:8px;margin-top:12px}
.add-ing input{flex:1;min-width:0}
.dishes{display:grid;gap:16px}
@media (min-width:700px){.dishes{grid-template-columns:1fr 1fr}}
.dish{background:var(--paper);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.ph{position:relative;background:linear-gradient(135deg,#DCEBD7,#F6EBB8) center/cover no-repeat;display:grid;place-items:center}
.ph .fb{font-size:3.2rem;transition:opacity .3s}
.ph.has .fb{opacity:0}
.dimg{aspect-ratio:16/10}
.badges{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.badges span{background:rgba(18,38,27,.82);color:#fff;font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;backdrop-filter:blur(4px)}
.dbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.dbody h3{margin:0;font-family:var(--display);font-size:1.3rem;letter-spacing:-.01em;line-height:1.15}
.dbody .cu{color:var(--muted);font-size:.88rem}
.dbody p{margin:0}
.bar{height:8px;border-radius:99px;background:var(--mint);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),#59a373);border-radius:99px}
.matchtxt{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--muted)}
.miss{font-size:.92rem}
.miss b{color:var(--radish)}
.dbody .btn{margin-top:auto}
.notice{background:#FFF6D6;border:1px solid var(--lemon);padding:12px 14px;border-radius:14px;margin-top:14px}
.error{white-space:pre-wrap;word-break:break-word;font-size:.9rem;background:#FBE4E8;border:1px solid var(--radish);padding:12px 14px;border-radius:14px;margin-top:14px;color:#7a1f31}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.loading{display:flex;gap:14px;align-items:center;padding:20px 4px;color:var(--muted);font-weight:500}
.spin{width:26px;height:26px;border-radius:50%;border:4px solid var(--mint);border-top-color:var(--leaf);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.sk{background:linear-gradient(100deg,#e4ecdf 30%,#f4f8f1 50%,#e4ecdf 70%) 0 0/200% 100%;animation:sh 1.3s linear infinite;border-radius:24px;height:230px}
@keyframes sh{to{background-position:-200% 0}}
.skgrid{display:grid;gap:16px;margin-top:6px}

/* toast + loader */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:80;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;font-weight:500}
.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;background:rgba(238,243,234,.94);z-index:70;display:grid;place-content:center;text-align:center;gap:14px;padding:24px}
.overlay .big{font-size:3.4rem;animation:bob 1.2s ease-in-out infinite}
.overlay p{margin:0;font-family:var(--display);font-weight:800;font-size:1.3rem}

/* cooking mode */
.cook{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.cook.show{transform:none}
.ctop{display:flex;align-items:center;gap:8px;padding:10px 12px 8px}
.ctitle{flex:1;min-width:0}
.ctitle b{display:block;font-family:var(--display);font-size:1.05rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctitle small{color:var(--muted)}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 0 var(--line);font-size:1.15rem;display:grid;place-items:center;flex:none}
.ib.on{background:var(--lemon)}
.ib.dark{background:var(--ink);color:#fff}
.segs{display:flex;gap:4px;padding:2px 14px 8px}
.seg{flex:1;height:8px;border:0;padding:0;border-radius:99px;background:var(--line)}
.seg.done{background:var(--leaf)}
.seg.now{background:var(--lemon);box-shadow:0 0 0 2px var(--ink) inset}
.pills{display:flex;gap:8px;padding:0 14px;overflow-x:auto}
.pills:empty{display:none}
.pill{flex:none;border:0;background:var(--ink);color:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:.9rem;margin-bottom:6px}
.pill.done{background:var(--radish);animation:bob .6s ease-in-out infinite}
.cbody{flex:1;overflow-y:auto;padding:8px 16px 24px;overscroll-behavior:contain}
.cinner{max-width:640px;margin:0 auto}
.cnav{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line)}
.cnav .btn{min-height:56px;font-size:1.05rem;border-radius:16px}
.cnav .btn.ghost{flex:1}
.cnav .btn.lemon{flex:2}

.visual{position:relative;border-radius:26px;padding:26px 16px;min-height:170px;display:grid;place-items:center;overflow:hidden;background:var(--vc,#DCEBD7)}
.vemo{font-size:4.6rem;line-height:1;display:inline-block;position:relative;z-index:1}
.flame{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.85);border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:700;display:flex;gap:2px;align-items:center}
.flame i{font-style:normal;opacity:.2;filter:grayscale(1)}
.flame i.on{opacity:1;filter:none}
.puff{position:absolute;bottom:20px;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.75);opacity:0;animation:rise 2.4s ease-in infinite}
.puff:nth-child(2){left:42%;animation-delay:.6s}.puff:nth-child(3){left:58%;animation-delay:1.2s}.puff:nth-child(4){left:50%;animation-delay:1.8s}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:.9}100%{transform:translateY(-110px) scale(1.5);opacity:0}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes chop{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(22deg) translateY(6px)}}
@keyframes stir{0%{transform:rotate(-14deg) translateX(-8px)}50%{transform:rotate(14deg) translateX(8px)}100%{transform:rotate(-14deg) translateX(-8px)}}
@keyframes sizzle{0%,100%{transform:translate(0)}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,-2px)}80%{transform:translate(2px,2px)}}
@keyframes spin2{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.a-bob .vemo{animation:bob 1.8s ease-in-out infinite}
.a-chop .vemo{animation:chop .7s ease-in-out infinite;transform-origin:70% 90%}
.a-stir .vemo{animation:stir 1.2s ease-in-out infinite}
.a-sizzle .vemo,.a-shake .vemo{animation:sizzle .5s linear infinite}
.a-spin .vemo{animation:spin2 1.6s linear infinite}
.a-pop .vemo{animation:pop .6s ease-out both}
@media (prefers-reduced-motion:reduce){.vemo,.puff,.pill.done,.overlay .big{animation:none!important}}

.stitle{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6vw,2.1rem);letter-spacing:-.02em;line-height:1.1;margin:16px 0 8px}
.stext{font-size:1.18rem;line-height:1.6;margin:0}
.lbl{font-weight:700;margin:20px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lbl small{color:var(--muted);font-weight:500}
.ichips{display:grid;gap:8px}
.ichip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px 12px 8px 8px;transition:.15s}
.ichip .itxt{display:flex;flex-direction:column;min-width:0}
.ichip .itxt small{color:var(--muted)}
.ithumb{width:52px;height:52px;border-radius:14px;background:var(--mint) center/cover no-repeat;display:grid;place-items:center;font-size:1.6rem;flex:none}
.ithumb.has .fb{display:none}
.tick{margin-left:auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.ichip.on{border-color:var(--leaf);background:#F1F8EE}
.ichip.on .tick{background:var(--leaf);border-color:var(--leaf)}
.ichip .need{color:var(--radish);font-size:.78rem;font-weight:700}
.cue{margin-top:16px;background:#fff;border-radius:16px;padding:12px 14px;border-left:6px solid var(--leaf)}
.tip{margin-top:12px;background:#FFF6D6;border-left:6px solid var(--lemon);padding:11px 14px;border-radius:14px}
.timer{position:relative;width:156px;margin:22px auto 8px}
.ring{width:156px;height:156px;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--mint)}
.ring .fg{stroke:var(--leaf);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.timer.done .fg{stroke:var(--radish)}
.tmid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.tmid .t{font-family:var(--display);font-weight:800;font-size:2.1rem;letter-spacing:-.02em;line-height:1}
.tmid small{color:var(--muted)}
.tbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.hero{border-radius:26px;aspect-ratio:16/10;overflow:hidden}
.hero .fb{font-size:4.5rem}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.meta span{background:#fff;border-radius:999px;padding:6px 13px;font-weight:700;font-size:.9rem;box-shadow:0 1px 0 var(--line)}
.finish{text-align:center;position:relative}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:55}
.confetti span{position:absolute;top:-30px;font-size:1.6rem;animation:fall 3.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.tipsbox{text-align:left;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span>🍳</span>PantryChef</div>
    <nav aria-label="Sections">
      <button id="tabCook" aria-pressed="true">Cook</button>
      <button id="tabSaved" aria-pressed="false">Saved <span id="savedCount"></span></button>
    </nav>
  </header>

  <main id="viewCook">
    <h1>What’s in your kitchen?</h1>
    <p class="lead">Click photos of your fridge or groceries. Get dishes you can make right now, with easy step-by-step help.</p>

    <label class="drop" id="drop" for="fileInput">
      <strong>Add photos of your ingredients</strong>
      <p><span class="desk">Paste with Ctrl+V, drag and drop, or </span>choose from below.</p>
      <div class="pick">
        <button type="button" class="btn" id="btnCamera">📷 Take photo</button>
        <button type="button" class="btn ghost" id="btnChoose">🖼️ From gallery</button>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </label>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>

    <div class="panel">
      <label class="field" for="notes">Anything else at home? Or something to avoid?</label>
      <textarea id="notes" placeholder="e.g. rice, eggs, curry leaves. No mushrooms please."></textarea>
      <div class="row">
        <div>
          <label class="field">Servings</label>
          <div class="stepper">
            <button type="button" id="minus" aria-label="Fewer servings">−</button>
            <output id="servings">2</output>
            <button type="button" id="plus" aria-label="More servings">+</button>
          </div>
        </div>
        <div>
          <label class="field" for="maxTime">Time you have</label>
          <select id="maxTime">
            <option value="0">Any</option><option value="15">Up to 15 min</option>
            <option value="30">Up to 30 min</option><option value="45">Up to 45 min</option>
            <option value="60">Up to 1 hour</option>
          </select>
        </div>
        <div class="full">
          <label class="field" for="cuisine">Cuisine</label>
          <select id="cuisine">
            <option value="any">Surprise me</option><option selected>Indian</option><option>South Indian</option>
            <option>North Indian</option><option>Arabic / Middle Eastern</option><option>Italian</option>
            <option>Asian</option><option>Mexican</option><option>Continental</option>
          </select>
        </div>
      </div>
      <label class="field" style="margin-top:16px">Diet</label>
      <div class="chips" id="diet"></div>
    </div>

    <div id="msg"></div>

    <section id="results" class="hidden">
      <h2>What I can see</h2>
      <div class="panel" style="margin-top:0">
        <div class="found" id="found"></div>
        <form class="add-ing" id="addForm">
          <input id="addInput" placeholder="Add or correct an ingredient" aria-label="Add an ingredient">
          <button class="btn ghost" type="submit">Add</button>
        </form>
        <button class="btn block" id="refresh" style="margin-top:12px">Update dishes</button>
      </div>
      <h2>Dishes you can make</h2>
      <div class="dishes" id="dishes"></div>
    </section>
  </main>

  <main id="viewSaved" class="hidden">
    <h1>Saved recipes</h1>
    <p class="lead">Your saved recipes open instantly, even without a new search.</p>
    <div class="dishes" id="savedList"></div>
  </main>
</div>

<div class="cta" id="cta"><button class="btn lemon block" id="go">Find dishes</button></div>
<div class="cook hidden" id="cook" role="dialog" aria-modal="true" aria-label="Cooking mode"></div>
<div class="toast" id="toast" role="status"></div>
<div class="overlay hidden" id="loader"><div class="big">🍳</div><p id="loaderTxt">Writing your recipe…</p></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const buzz = (n = 12) => { try { navigator.vibrate?.(n); } catch {} };
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600); }

const state = {
  images: [], ingredients: [], dishes: [],
  diet: new Set(store.get('pc_diet', [])), servings: store.get('pc_servings', 2),
  saved: store.get('pc_saved', []), pw: store.get('pc_pw', ''), cook: null,
};
const DIETS = ['Vegetarian','Vegan','Eggless','Gluten-free','Dairy-free','Halal','High-protein'];

/* ---------- food photos from Wikipedia (free, no key) ---------- */
const imgCache = store.get('pc_img', {});
const inflight = new Map();
function wikiImg(q) {
  q = (q || '').trim().toLowerCase();
  if (!q) return Promise.resolve('');
  if (q in imgCache) return Promise.resolve(imgCache[q]);
  if (inflight.has(q)) return inflight.get(q);
  const p = (async () => {
    try {
      const u = 'https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=0&gsrlimit=4&prop=pageimages&piprop=thumbnail&pithumbsize=640&gsrsearch=' + encodeURIComponent(q);
      const d = await (await fetch(u)).json();

async function api(path, body) {

  if (res.status === 401) {

function resizeToJpeg(file, max = 1280) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const d = c.toDataURL('image/jpeg', 0.82); URL.revokeObjectURL(url);
      resolve({ data: d.split(',')[1], preview: d });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file could not be read as an image.')); };
    img.src = url;
  });
}
async function addFiles(files) {

}

  const c = state.cook; if (!c) return '';
  return Object.entries(c.timers).filter(([, t]) => t.running || t.left <= 0)
    .map(([k, t]) => `<button class="pill ${t.left <= 0 ? 'done' : ''}" data-go="${k}">⏱ ${esc(t.label)} · ${t.left <= 0 ? 'done!' : fmt(t.left)}</button>`).join('');
}
function refreshTimerUI() {
  const c = state.cook; if (!c) return; const s = c.r.steps?.[c.i];
  const w = $('#timerWrap'); if (w && s?.timer_minutes) w.innerHTML = timerHTML(c.i, s.timer_minutes);
  const p = $('#pills'); if (p) p.innerHTML = pillsHTML();
}
function paintTimers() {
  const c = state.cook; if (!c) return; const t = c.timers[c.i];
  if (t) {
    const tv = $('#tv'), fg = $('#ringfg');
    if (tv) tv.textContent = fmt(t.left);
    if (fg) fg.setAttribute('stroke-dashoffset', 2 * Math.PI * 54 * (1 - t.left / t.total));
  }
  const p = $('#pills'); if (p) p.innerHTML = pillsHTML();
}
function ensureTick() {
  if (tick) return;
  tick = setInterval(() => {
    const c = state.cook; if (!c) { clearInterval(tick); tick = null; return; }
    let running = false;
    for (const [k, t] of Object.entries(c.timers)) {
      if (!t.running) continue;
      t.left -= 1;
      if (t.left <= 0) { t.left = 0; t.running = false; alarm(+k); } else running = true;
    }
    paintTimers();
    if (!running) { clearInterval(tick); tick = null; }
  }, 1000);
}
function alarm(k) {
  const c = state.cook; const s = c.r.steps[k];
  beep(); buzz([300, 150, 300]); toast(`⏰ ${s.title} – time’s up!`);
  if (c.speak) speak(`Time's up for ${s.title}`);
  if (c.i === k) refreshTimerUI();
}
function beep() {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.35, 0.7].forEach((d) => { const o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = 0.2; o.start(a.currentTime + d); o.stop(a.currentTime + d + 0.2); });
  } catch {}
}
function getTimer(create) {
  const c = state.cook, k = c.i, s = c.r.steps[k];
  if (!c.timers[k] && create) c.timers[k] = { total: s.timer_minutes * 60, left: s.timer_minutes * 60, running: false, label: s.title };
  return c.timers[k];
}
function toggleTimer() {
  const c = state.cook; const t = getTimer(true);
  if (t.left <= 0) { delete c.timers[c.i]; return refreshTimerUI(); }
  t.running = !t.running; if (t.running) ensureTick(); refreshTimerUI();
}

/* voice commands */
function toggleListen() {
  const c = state.cook; if (!SR) return toast('Voice commands are not supported in this browser');
  if (c.listen) { c.listen = false; try { rec?.stop(); } catch {} rec = null; return renderCook(); }
  c.listen = true; startRec(); toast('Listening. Say “next”, “back”, “repeat” or “start timer”'); renderCook();
}
function startRec() {
  rec = new SR(); rec.lang = 'en-IN'; rec.continuous = true; rec.interimResults = false;
  rec.onresult = (e) => voiceCmd(e.results[e.results.length - 1][0].transcript.toLowerCase());
  rec.onend = () => { if (state.cook?.listen) { try { rec.start(); } catch {} } };
  rec.onerror = (ev) => { if (ev.error === 'not-allowed' && state.cook) { state.cook.listen = false; toast('Microphone permission was denied'); renderCook(); } };
  try { rec.start(); } catch {}
}
function voiceCmd(t) {
  const c = state.cook; if (!c) return; const s = c.r.steps?.[c.i];
  if (/\b(next|aage|continue|forward)\b/.test(t)) go(c.i + 1);
  else if (/\b(back|previous|pichla|before)\b/.test(t)) go(c.i - 1);
  else if (/\b(repeat|again|read)\b/.test(t)) speakStep();
  else if (/\btimer\b|\bstart\b/.test(t) && s?.timer_minutes) { const tm = getTimer(true); if (!tm.running) toggleTimer(); }
  else if (/\b(stop|pause)\b/.test(t) && s?.timer_minutes) { const tm = getTimer(false); if (tm?.running) toggleTimer(); }
}

/* events (delegated, so re-rendering never loses them) */
$('#cook').addEventListener('click', (e) => {
  const c = state.cook; if (!c) return; const n = (c.r.steps || []).length;
  const chip = e.target.closest('[data-chip]');
  if (chip) {
    const key = chip.dataset.chip; const on = !chip.classList.contains('on');
    chip.classList.toggle('on', on); chip.setAttribute('aria-pressed', on); buzz(8);
    if (key[0] === 'g') { const k = +key.slice(1); on ? c.gathered.add(k) : c.gathered.delete(k); const g = $('#gcount'); if (g) g.textContent = `${c.gathered.size} of ${(c.r.ingredients || []).length} ready`; }
    else { const id = key.slice(1); on ? c.added.add(id) : c.added.delete(id); const u = $('#ucount'); if (u) { const s = c.r.steps[c.i]; u.textContent = `${(s.uses || []).filter((_, j) => c.added.has(`${c.i}:${j}`)).length} of ${s.uses.length} added`; } }
    return;
  }
  const goBtn = e.target.closest('[data-go]'); if (goBtn) return go(+goBtn.dataset.go);
  const id = e.target.closest('button')?.id;
  if (id === 'cx') return closeCook();
  if (id === 'cprev') return go(c.i - 1);
  if (id === 'cnext') return c.i >= n ? closeCook() : go(c.i + 1);
  if (id === 'csave' || id === 'csave2') { toggleSave(c.r); toast(isSaved(c.r) ? 'Saved ❤️' : 'Removed from saved'); return renderCook(); }
  if (id === 'cspeak') { c.speak = !c.speak; store.set('pc_speak', c.speak); try { speechSynthesis.cancel(); } catch {} renderCook(); if (c.speak) (c.i >= 0 && c.i < n ? speakStep() : speak(c.r.name)); return; }
  if (id === 'cmic') return toggleListen();
  if (id === 'tbtn') return toggleTimer();
  if (id === 'tplus') { const t = getTimer(true); t.total += 60; t.left += 60; return refreshTimerUI(); }
  if (id === 'treset') { delete c.timers[c.i]; return refreshTimerUI(); }
});
let tx = 0, ty = 0;
$('#cook').addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$('#cook').addEventListener('touchend', (e) => {
  const c = state.cook; if (!c || e.target.closest('.pills,.chips,input')) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 45) go(c.i + (dx < 0 ? 1 : -1));
}, { passive: true });
document.addEventListener('keydown', (e) => {
  const c = state.cook; if (!c) return;
  if (e.key === 'Escape') closeCook(); else if (e.key === 'ArrowRight') go(c.i + 1); else if (e.key === 'ArrowLeft') go(c.i - 1);
});
document.addEventListener('visibilitychange', () => { if (state.cook && document.visibilityState === 'visible') keepAwake(); });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

/* ---------- init ---------- */
renderDiet(); renderServings(); renderSaved();
</script>
</body>
</html>
